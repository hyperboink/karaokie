<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Blocked — Karaokie</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #030712;
      color: #f9fafb;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 2rem;
      user-select: none;
      -webkit-user-select: none;
    }

    .card {
      text-align: center;
      max-width: 360px;
      width: 100%;
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      color: #facc15;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 0.9rem;
      color: #9ca3af;
      line-height: 1.6;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: #facc15;
      border-radius: 2px;
      margin: 1.5rem auto;
      opacity: 0.5;
    }

    .brand {
      font-size: 0.75rem;
      color: #4b5563;
    }

    .brand a {
      color: #6b7280;
      text-decoration: none;
    }

    .brand a:hover {
      color: #facc15;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #facc15;
      color: #030712;
      font-weight: 700;
      font-size: 0.875rem;
      padding: 0.6rem 1.75rem;
      border-radius: 0.75rem;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
    }

    .home-btn:hover { background: #fde047; transform: scale(1.04); }
    .home-btn:active { background: #eab308; transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="card">
    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
        d="M12 9v3.75m0-10.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.75c0 5.592 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.57-.598-3.75h-.152c-3.196 0-6.1-1.25-8.25-3.286Zm0 13.036h.008v.008H12v-.008Z" />
    </svg>

    <h1>Access Blocked</h1>
    <p>Developer tools have been detected.<br />Please close it.</p>

    <div class="divider"></div>

    <a href="/" class="home-btn">
      Go back to singing 🎤
    </a>

    <div class="divider"></div>

    <p class="brand">
      &copy; <a href="https://hyperboink.net/" target="_blank" rel="noopener noreferrer">Hyperboink</a>. All Rights Reserved.
    </p>
  </div>
</body>
</html>
